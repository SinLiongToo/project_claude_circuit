
<button class="find-btn" id="findOpen" type="button" aria-label="Search all pages (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
<div class="find-ov" id="findOv" hidden>
  <div class="find-box" role="dialog" aria-modal="true" aria-label="Search all pages">
    <div class="find-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="findQ" type="search" placeholder="Search all pages, e.g. LDO PSRR, Cres, March C" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-controls="findRes">
      <kbd>Esc</kbd>
    </div>
    <div class="find-meta" id="findMeta"></div>
    <div class="find-res" id="findRes" role="listbox"></div>
  </div>
</div>
<button class="theme-btn" id="themeBtn" type="button" aria-label="Colour theme: Auto (follows your system). Click to change."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg><span id="themeLbl">Auto</span></button>
<script>
(function(){
  // collapsible contents panel, remembered per browser
  const nav=document.querySelector("nav.toc");if(!nav)return;
  const root=document.documentElement;
  const b=document.createElement("button");b.type="button";b.className="toc-toggle";
  const icoHide='<path d="M15 6l-6 6 6 6"/>', icoShow='<path d="M4 6h16M4 12h16M4 18h16"/>';
  function paint(){
    const c=root.classList.contains("toc-collapsed");
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'+(c?icoShow:icoHide)+'</svg><span>'+(c?"Show contents":"Hide contents")+'</span>';
    b.setAttribute("aria-expanded",c?"false":"true");
    b.setAttribute("aria-label",c?"Show contents":"Hide contents");b.title=c?"Show contents":"Hide contents";
  }
  b.addEventListener("click",()=>{
    const c=root.classList.toggle("toc-collapsed");
    try{c?localStorage.setItem("toc","collapsed"):localStorage.removeItem("toc")}catch(e){}
    paint();
  });
  nav.insertBefore(b,nav.firstChild);paint();
})();
(function(){
  // colour theme: Auto (system) -> Light -> Dark, remembered per browser
  const root=document.documentElement, b=document.getElementById("themeBtn"), lbl=document.getElementById("themeLbl");
  if(!b)return;
  const icons={auto:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>',
    light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    dark:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'};
  const names={auto:"Auto",light:"Light",dark:"Dark"}, next={auto:"light",light:"dark",dark:"auto"};
  let mode="auto";try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")mode=t}catch(e){}
  function apply(m,announce){
    mode=m;
    if(m==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",m);
    try{m==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",m)}catch(e){}
    b.querySelector("svg").innerHTML=icons[m];lbl.textContent=names[m];
    b.setAttribute("aria-label","Colour theme: "+names[m]+(m==="auto"?" (follows your system)":"")+". Click to change.");
    if(announce)window.dispatchEvent(new Event("themechange"));
  }
  apply(mode,false);
  b.addEventListener("click",()=>apply(next[mode],true));
})();
(function(){
  const $=id=>document.getElementById(id);
  const ov=$("findOv"), q=$("findQ"), res=$("findRes"), meta=$("findMeta");
  const HINT="Searches every section of all pages: text, tables, formulas, notes, diagram labels, glossary. ↑ ↓ to move, Enter to open.";
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const norm=s=>s.replace(/\s+/g," ").trim();
  // --- this page: live DOM index ---
  const idx=[];
  const lede=document.querySelector("header.top .lede");
  if(lede)idx.push({el:lede,title:"Introduction",n:"",t:norm(lede.textContent),w:0});
  document.querySelectorAll("main section").forEach(sec=>{
    const h2=sec.querySelector("h2"), num=sec.querySelector(".num");
    const title=h2?h2.textContent.trim():"", n=num?num.textContent.trim():"";
    sec.querySelectorAll("h2,h3,p,li,tr,.eq,figcaption,dt,dd,.note,footer").forEach(el=>{
      if(el.closest("svg,form,.out,.find-ov"))return;
      if(el.tagName==="P"&&el.closest("li,.note"))return;
      if(el.tagName==="TR"&&el.querySelector("th"))return;
      const t=norm(el.textContent);
      if(t.length<2)return;
      idx.push({el,title,n,t,w:/^H[23]$/.test(el.tagName)?2:0});
    });
    sec.querySelectorAll("figure .fig:not(.chart) svg").forEach(svg=>{
      const t=[...svg.querySelectorAll("text")].map(x=>x.textContent.trim()).filter(Boolean).join(" · ");
      if(t)idx.push({el:svg.closest("figure"),title,n,t:"Diagram: "+t,w:0,fig:true});
    });
  });
  idx.forEach(e=>e.lt=e.t.toLowerCase());
  // --- other pages: static index embedded at build time ---
  let remote=[];
  try{
    const si=$("siteIndex"), site=JSON.parse(si.textContent), self=si.dataset.self;
    remote=site.items.filter(i=>i.p!==self).map(i=>{const pg=site.pages[i.p];
      return {remote:true,url:pg.url+(i.id?"#"+i.id:""),page:pg.title,title:i.s,n:i.n,t:i.t,lt:i.t.toLowerCase(),w:i.h?2:0}});
  }catch(e){}
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rx=terms=>new RegExp("("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  let hits=[], sel=0, terms=[];
  function snippet(t,lt){
    const p=Math.max(0,Math.min(...terms.map(x=>{const i=lt.indexOf(x);return i<0?1e9:i})));
    const a=Math.max(0,p-60), s=t.slice(a,a+190);
    return (a>0?"…":"")+esc(s).replace(rx(terms.map(esc)),"<mark>$1</mark>")+(a+190<t.length?"…":"");
  }
  function head(txt){const d=document.createElement("div");d.className="find-grp";d.textContent=txt;res.appendChild(d)}
  function search(){
    const v=q.value.trim().toLowerCase();
    terms=v.split(/\s+/).filter(Boolean);
    res.textContent="";sel=0;hits=[];
    if(!terms.length){meta.textContent=HINT;return}
    const m=e=>terms.every(x=>e.lt.includes(x));
    const here=idx.filter(m).sort((a,b)=>b.w-a.w), there=remote.filter(m).sort((a,b)=>b.w-a.w);
    const nh=here.length, nt=there.length;
    const home=!idx.length;  // landing page: no content of its own, search everything
    meta.textContent=(nh||nt)?(home?nt+" match"+(nt>1?"es":"")+" across all pages":nh+" on this page · "+nt+" on other pages"):"No matches";
    if(!nh&&!nt){res.innerHTML='<div class="find-empty">Nothing matches “'+esc(q.value.trim())+'”. Try fewer words or a shorter term (e.g. “PSRR”, “DAC”, “Cres”).</div>';return}
    const cap=home?120:60;
    hits=here.slice(0,60).concat(there.slice(0,cap));
    let i=0;
    if(nh){head("On this page");here.slice(0,60).forEach(h=>add(h,i++))}
    if(nt){head(home?"All pages":"Other pages");there.slice(0,cap).forEach(h=>add(h,i++))}
    mark(0);
  }
  function add(h,i){
    const b=document.createElement(h.remote?"a":"button");
    if(h.remote){b.href=h.url;b.addEventListener("click",()=>remember())}else{b.type="button";b.addEventListener("click",()=>go(i))}
    b.className="find-item";b.setAttribute("role","option");b.id="fi"+i;
    const where=h.remote?'<b>'+esc(h.page)+'</b><span>'+esc((h.n?h.n+" · ":"")+h.title)+'</span>':'<b>'+esc(h.n)+'</b><span>'+esc(h.title)+(h.fig?" · diagram":"")+'</span>';
    b.innerHTML='<span class="fs">'+where+'</span><span class="fx">'+snippet(h.t,h.lt)+'</span>';
    b.addEventListener("mousemove",()=>mark(i));
    res.appendChild(b);
  }
  function mark(i){
    const items=res.querySelectorAll(".find-item");if(!items.length)return;
    sel=(i+items.length)%items.length;
    items.forEach((b,j)=>b.setAttribute("aria-selected",j===sel?"true":"false"));
    items[sel].scrollIntoView({block:"nearest"});
    q.setAttribute("aria-activedescendant","fi"+sel);
  }
  function remember(){try{localStorage.setItem("findJump",JSON.stringify({q:terms.join(" "),t:Date.now()}))}catch(e){}}
  function clearHits(){
    document.querySelectorAll("mark.find-hit").forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()});
  }
  function highlight(el){
    if(el.tagName==="FIGURE")return;
    const r=rx(terms), nodes=[], w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest("svg,script,style")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{
      const s=n.nodeValue;r.lastIndex=0;if(!r.test(s))return;r.lastIndex=0;
      const f=document.createDocumentFragment();let last=0,m;
      while((m=r.exec(s))){f.appendChild(document.createTextNode(s.slice(last,m.index)));const k=document.createElement("mark");k.className="find-hit";k.textContent=m[0];f.appendChild(k);last=m.index+m[0].length}
      f.appendChild(document.createTextNode(s.slice(last)));n.parentNode.replaceChild(f,n);
    });
  }
  function show(el){
    clearHits();highlight(el);
    el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
    el.classList.remove("find-flash");void el.offsetWidth;el.classList.add("find-flash");
    setTimeout(()=>el.classList.remove("find-flash"),1900);
  }
  function go(i){
    const h=hits[i];if(!h)return;
    if(h.remote){remember();const a=res.querySelectorAll(".find-item")[i];if(a)a.click();return}
    close(false);show(h.el);
  }
  let lastFocus=null;
  function open(){lastFocus=document.activeElement;ov.hidden=false;q.focus();q.select();search()}
  function close(restore){ov.hidden=true;if(restore!==false&&lastFocus&&lastFocus.focus)lastFocus.focus()}
  $("findOpen").addEventListener("click",open);
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  q.addEventListener("input",search);
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();mark(sel+1)}
    else if(e.key==="ArrowUp"){e.preventDefault();mark(sel-1)}
    else if(e.key==="Enter"){e.preventDefault();go(sel)}
  });
  document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==="k"){e.preventDefault();ov.hidden?open():close();return}
    if(e.key==="Escape"){if(!ov.hidden)close();else clearHits();return}
    if(e.key==="/"&&ov.hidden&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();open()}
  });
  meta.textContent=HINT;
  // arriving from a result on another page: highlight the match inside the target section
  let j=null;try{j=JSON.parse(localStorage.getItem("findJump")||"null");localStorage.removeItem("findJump")}catch(e){}
  if(j&&Date.now()-j.t<20000&&j.q){
    terms=j.q.split(" ").filter(Boolean);
    const id=location.hash.slice(1), scope=id&&document.getElementById(id);
    const cand=idx.filter(e=>(!scope||scope.contains(e.el))&&terms.every(x=>e.lt.includes(x))).sort((a,b)=>a.w-b.w);
    if(cand.length)setTimeout(()=>show(cand[0].el),350);
  }
})();
</script>
